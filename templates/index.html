<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iNetchat — دردشة خاصة</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0b0b0f; --card: #16161c; --card2: #1c1c23;
  --border: rgba(255,255,255,0.08); --text: #fff; --subtext: #8e8e93;
  --accent: #0a84ff; --accent2: #0062d2; --danger: #ff453a; --success: #32d74b;
}

body {
  font-family: 'Cairo','Poppins',-apple-system,sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; direction: rtl; overflow-x: hidden;
  padding-bottom: 100px;
}

/* ===== SPLASH ===== */
#splash { position: fixed; inset: 0; background: var(--bg); z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s ease; }
#splash.hide { opacity: 0; pointer-events: none; }
.splash-logo { width: 100px; height: 100px; border-radius: 28px;
  box-shadow: 0 15px 40px rgba(10,132,255,0.4);
  animation: pulse 2s ease-in-out infinite; overflow: hidden; }
.splash-logo svg { width: 100%; height: 100%; display: block; }
.splash-title { font-family: 'Poppins',sans-serif; font-size: 36px; font-weight: 900;
  margin-top: 24px; letter-spacing: -1px;
  background: linear-gradient(135deg,var(--accent),#5ac8fa);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

/* ===== AUTH ===== */
#authScreen { display: none; width: 100%; max-width: 400px;
  margin: 0 auto; padding: 40px 20px; min-height: 100vh;
  align-items: center; justify-content: center; flex-direction: column; }
#authScreen.show { display: flex; animation: fadeUp 0.5s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.auth-header { text-align: center; margin-bottom: 32px; }
.auth-header .logo { width: 70px; height: 70px; border-radius: 22px;
  display: inline-block; margin-bottom: 16px;
  box-shadow: 0 12px 30px rgba(10,132,255,0.4); overflow: hidden; }
.auth-header .logo svg { width: 100%; height: 100%; display: block; }
.auth-title { font-size: 26px; font-weight: 900; margin-bottom: 6px;
  background: linear-gradient(135deg,var(--accent),#5ac8fa);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; }
.auth-sub { color: var(--subtext); font-size: 14px; line-height: 1.5; }
.form-group { margin-bottom: 14px; width: 100%; }
.form-group label { display: block; font-size: 12px; font-weight: 700;
  color: var(--subtext); margin-bottom: 6px; }
.input { width: 100%; padding: 15px 16px; background: var(--card);
  border: 1.5px solid var(--border); border-radius: 14px;
  color: var(--text); font-family: inherit; font-size: 14px;
  outline: none; transition: all 0.25s; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(10,132,255,0.12); }
.input::placeholder { color: var(--subtext); }
textarea.input { resize: none; }
.btn-primary { width: 100%; padding: 15px;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: #fff; border: none; border-radius: 14px; font-weight: 800;
  font-size: 15px; font-family: inherit; cursor: pointer;
  box-shadow: 0 8px 24px rgba(10,132,255,0.4);
  transition: transform 0.2s; margin-top: 8px; }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.switch-text { text-align: center; margin-top: 20px; font-size: 13px; color: var(--subtext); }
.switch-text button { background: none; border: none; color: var(--accent);
  font-weight: 800; font-family: inherit; font-size: 13px;
  cursor: pointer; text-decoration: underline; }

/* ===== MAIN APP ===== */
#appScreen { display: none; min-height: 100vh; }
#appScreen.show { display: block; animation: fadeUp 0.4s ease; }

.app-header { display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px; background: rgba(11,11,15,0.85);
  backdrop-filter: blur(20px); position: sticky; top: 0;
  z-index: 100; border-bottom: 1px solid var(--border); }
.app-logo { display: flex; align-items: center; gap: 10px;
  font-family: 'Poppins',sans-serif; font-weight: 900; font-size: 20px; }
.app-logo .mini { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; }
.app-logo .mini svg { width: 100%; height: 100%; display: block; }
.app-logo span { background: linear-gradient(135deg,var(--accent),#5ac8fa);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; }
.page-title { font-size: 18px; font-weight: 900; }

.container { padding: 8px 20px; max-width: 600px; margin: 0 auto; }
.section-title { font-size: 13px; font-weight: 800; color: var(--subtext);
  margin: 20px 0 12px 0; letter-spacing: 0.5px; }

/* ===== CARDS ===== */
.card { display: flex; align-items: center; gap: 14px;
  padding: 14px; background: var(--card);
  border: 1px solid var(--border); border-radius: 18px;
  margin-bottom: 10px; cursor: pointer; transition: all 0.25s; }
.card:active { transform: scale(0.98); border-color: var(--accent); }
.card-avatar { width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 20px; color: #fff; flex-shrink: 0; }
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 800; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-username { font-size: 12px; color: var(--subtext); font-weight: 600; }

.empty { text-align: center; color: var(--subtext);
  padding: 60px 20px; font-size: 13px; line-height: 1.6; }

/* ===== SEARCH ===== */
.search-box { position: relative; margin-bottom: 12px; }
.search-box input { width: 100%; padding: 14px 16px 14px 44px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 14px; color: var(--text);
  font-family: inherit; font-size: 14px; outline: none; }
.search-box input:focus { border-color: var(--accent); }
.search-box .search-ico { position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px;
  stroke: var(--subtext); fill: none; stroke-width: 2.2; }

/* ===== CHAT ===== */
#chatWindow { position: fixed; inset: 0; background: var(--bg);
  z-index: 500; display: none; flex-direction: column; }
#chatWindow.show { display: flex; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
.chat-header { display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: rgba(11,11,15,0.9);
  backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10; }
.chat-back { width: 40px; height: 40px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text); cursor: pointer; }
.chat-back svg { width: 20px; height: 20px; stroke: currentColor;
  fill: none; stroke-width: 2.5; }
.chat-user { flex: 1; min-width: 0; }
.chat-user-name { font-size: 15px; font-weight: 800; }
.chat-user-status { font-size: 11px; color: var(--success); font-weight: 700; }

.chat-note-banner { margin: 8px 16px; padding: 10px 14px;
  background: linear-gradient(135deg, rgba(255,159,10,0.15), rgba(255,159,10,0.08));
  border: 1px solid rgba(255,159,10,0.3); border-radius: 12px;
  display: flex; align-items: center; gap: 10px; cursor: pointer; }
.chat-note-banner svg { width: 18px; height: 18px; stroke: #ff9f0a;
  fill: none; stroke-width: 2.2; flex-shrink: 0; }
.chat-note-text { font-size: 12px; color: #ff9f0a; font-weight: 700;
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-messages { flex: 1; overflow-y: auto; padding: 20px 16px;
  display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 18px;
  font-size: 14px; line-height: 1.5; word-wrap: break-word;
  animation: msgIn 0.25s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg.me { align-self: flex-end;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  color: #fff; border-bottom-right-radius: 6px; }
.msg.other { align-self: flex-start; background: var(--card2);
  color: var(--text); border-bottom-left-radius: 6px;
  border: 1px solid var(--border); }
.msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; display: block; }

.chat-input { display: flex; gap: 8px; padding: 12px 16px;
  background: rgba(11,11,15,0.9); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); }
.chat-input input { flex: 1; padding: 14px 16px; background: var(--card);
  border: 1.5px solid var(--border); border-radius: 24px;
  color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
.chat-input input:focus { border-color: var(--accent); }
.chat-send { width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  border: none; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(10,132,255,0.4); }
.chat-send:active { transform: scale(0.9); }
.chat-send svg { width: 20px; height: 20px; stroke: #fff;
  fill: none; stroke-width: 2.5; }

/* ===== PROFILE / SETTINGS ===== */
.profile-content { padding: 24px 20px 40px 20px; max-width: 500px; margin: 0 auto; width: 100%; }
.profile-big-avatar { width: 110px; height: 110px; border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 44px; color: #fff;
  margin: 0 auto 16px auto;
  box-shadow: 0 12px 30px rgba(10,132,255,0.4); }
.profile-display-name { font-size: 22px; font-weight: 900;
  text-align: center; margin-bottom: 4px; }
.profile-username { font-size: 14px; color: var(--subtext);
  text-align: center; margin-bottom: 6px; }
.profile-bio { font-size: 13px; color: var(--subtext);
  text-align: center; margin-bottom: 20px; line-height: 1.5; }
.profile-edit-btn { display: block; margin: 0 auto 28px auto;
  padding: 10px 24px; border-radius: 12px;
  background: var(--card); border: 1.5px solid var(--accent);
  color: var(--accent); font-weight: 800; font-family: inherit;
  font-size: 13px; cursor: pointer; }
.settings-group { background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; overflow: hidden; margin-bottom: 16px; }
.settings-group-title { font-size: 11px; font-weight: 800;
  color: var(--subtext); padding: 14px 18px 8px 18px;
  letter-spacing: 1px; text-transform: uppercase; }
.setting-row { display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-top: 1px solid var(--border);
  cursor: pointer; transition: background 0.2s; }
.setting-row:active { background: rgba(255,255,255,0.03); }
.setting-row-left { display: flex; align-items: center; gap: 12px; }
.setting-row-icon { width: 34px; height: 34px; border-radius: 10px;
  background: rgba(10,132,255,0.12); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; }
.setting-row-icon svg { width: 17px; height: 17px; stroke: var(--accent);
  fill: none; stroke-width: 2.2; }
.setting-row-label { font-size: 14px; font-weight: 700; }
.setting-row-value { font-size: 13px; color: var(--subtext); }
.setting-row.danger .setting-row-icon { background: rgba(255,69,58,0.12); }
.setting-row.danger .setting-row-icon svg { stroke: var(--danger); }
.setting-row.danger .setting-row-label { color: var(--danger); }
.setting-toggle { width: 46px; height: 26px; border-radius: 13px;
  background: var(--border); position: relative;
  transition: background 0.3s; cursor: pointer; }
.setting-toggle.on { background: var(--accent); }
.setting-toggle::after { content: ''; position: absolute; top: 3px; right: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: transform 0.3s; }
.setting-toggle.on::after { transform: translateX(-20px); }

/* ===== BOTTOM NAV ===== */
.bottom-bar { position: fixed; bottom: 14px; left: 50%;
  transform: translateX(-50%); width: 94%; max-width: 520px;
  z-index: 1000; display: flex; align-items: center; gap: 8px;
  justify-content: center; }
.bottom-nav { flex: 1; display: flex; justify-content: space-around;
  align-items: center; padding: 10px 4px;
  background: rgba(20,20,26,0.92); backdrop-filter: blur(30px);
  border: 1px solid var(--border); border-radius: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
.nav-btn { flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  background: none; border: none; color: var(--subtext);
  font-family: inherit; font-size: 10px; font-weight: 800;
  cursor: pointer; padding: 6px 4px; border-radius: 14px;
  transition: all 0.25s; position: relative; }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor;
  fill: none; stroke-width: 2; transition: all 0.25s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { stroke: var(--accent);
  filter: drop-shadow(0 0 8px rgba(10,132,255,0.6)); }
.nav-btn .badge { position: absolute; top: 2px; right: 8px;
  background: var(--danger); color: #fff; font-size: 9px;
  font-weight: 900; padding: 2px 5px; border-radius: 10px;
  min-width: 16px; text-align: center; }
.search-fab { width: 56px; height: 56px; border-radius: 50%;
  background: rgba(20,20,26,0.92); backdrop-filter: blur(30px);
  border: 1px solid var(--border); color: var(--text);
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
  box-shadow: 0 15px 40px rgba(0,0,0,0.5); transition: transform 0.2s; }
.search-fab:active { transform: scale(0.9); }
.search-fab svg { width: 22px; height: 22px; stroke: var(--text);
  fill: none; stroke-width: 2.2; }

/* ===== POSTS (تغريدة) ===== */
.post-card { background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 16px; margin-bottom: 12px;
  animation: msgIn 0.25s ease; }
.post-head { display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px; }
.post-avatar { width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #fff; flex-shrink: 0; }
.post-info { flex: 1; min-width: 0; }
.post-name { font-size: 14px; font-weight: 800; }
.post-time { font-size: 11px; color: var(--subtext); font-weight: 600; }
.post-text { font-size: 14px; line-height: 1.6; margin-bottom: 10px;
  word-wrap: break-word; }
.post-image { width: 100%; border-radius: 14px; max-height: 400px;
  object-fit: cover; margin-bottom: 10px; }
.post-actions { display: flex; justify-content: flex-end; gap: 8px; }
.post-del { background: rgba(255,69,58,0.1); color: var(--danger);
  border: 1px solid rgba(255,69,58,0.3); padding: 6px 12px;
  border-radius: 10px; font-size: 11px; font-weight: 800;
  cursor: pointer; font-family: inherit; }

.fab-create { position: fixed; bottom: 90px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  border: none; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 30px rgba(10,132,255,0.5); z-index: 999; }
.fab-create:active { transform: scale(0.9); }
.fab-create svg { width: 24px; height: 24px; stroke: #fff;
  fill: none; stroke-width: 2.5; }

/* ===== MODAL ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px); z-index: 800;
  display: none; align-items: center; justify-content: center;
  padding: 20px; }
.modal-overlay.show { display: flex; animation: fadeUp 0.3s ease; }
.modal-card { background: var(--card); border: 1px solid var(--border);
  border-radius: 24px; padding: 24px 22px; width: 100%;
  max-width: 400px; max-height: 90vh; overflow-y: auto; }
.modal-card h3 { font-size: 18px; font-weight: 900;
  margin-bottom: 20px; text-align: center; }
.modal-btn-row { display: flex; gap: 8px; margin-top: 8px; }
.modal-btn-row .btn-primary { flex: 1; }
.btn-secondary-modal { flex: 1; padding: 15px; background: var(--card2);
  color: var(--text); border: 1px solid var(--border);
  border-radius: 14px; font-weight: 800; font-size: 15px;
  font-family: inherit; cursor: pointer; }

/* ===== TOAST ===== */
#toast { position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 22px; font-size: 13px;
  font-weight: 700; z-index: 10000; transition: transform 0.3s ease;
  max-width: 90%; text-align: center; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.success { border-color: var(--success); color: var(--success); }
#toast.error { border-color: var(--danger); color: var(--danger); }

.loader-dots { display: flex; gap: 6px; justify-content: center;
  padding: 20px; }
.loader-dots span { width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); animation: dotPulse 1.4s infinite; }
.loader-dots span:nth-child(2) { animation-delay: 0.2s; background: #ff453a; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; background: #ff9f0a; }
@keyframes dotPulse { 0%,100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } }

/* ===== LIGHT MODE ===== */
body.light-mode {
  --bg: #f2f2f7; --card: #fff; --card2: #f7f7fa;
  --border: rgba(0,0,0,0.08); --text: #000; --subtext: #636366;
}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0062d2"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#g)"/><path d="M50 25c-13.8 0-25 9.8-25 22 0 7.2 3.8 13.6 9.8 17.6-.6 3.4-2.6 6.4-5.6 8.4 4.6-.6 8.8-2.6 11.8-5.6 2.8.8 5.8 1.2 9 1.2 13.8 0 25-9.8 25-22S63.8 25 50 25z" fill="#fff"/></svg>
  </div>
  <div class="splash-title">iNetchat</div>
</div>

<div id="authScreen">
  <div class="auth-header">
    <div class="logo">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0062d2"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#g2)"/><path d="M50 25c-13.8 0-25 9.8-25 22 0 7.2 3.8 13.6 9.8 17.6-.6 3.4-2.6 6.4-5.6 8.4 4.6-.6 8.8-2.6 11.8-5.6 2.8.8 5.8 1.2 9 1.2 13.8 0 25-9.8 25-22S63.8 25 50 25z" fill="#fff"/></svg>
    </div>
    <h1 class="auth-title" id="authTitle">تسجيل الدخول</h1>
    <p class="auth-sub" id="authSub">مرحباً بعودتك! سجل دخولك للمتابعة.</p>
  </div>
  <form id="authForm" onsubmit="handleAuth(event)" style="width:100%">
    <div class="form-group" id="usernameGroup" style="display:none;"><label>اسم المستخدم</label><input type="text" id="username" class="input" placeholder="ahmed_dz"></div>
    <div class="form-group" id="displayNameGroup" style="display:none;"><label>الاسم الكامل</label><input type="text" id="displayName" class="input" placeholder="أحمد بن علي"></div>
    <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" class="input" placeholder="example@gmail.com" required></div>
    <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" class="input" placeholder="6 أحرف على الأقل" required></div>
    <button type="submit" class="btn-primary" id="submitBtn">تسجيل الدخول</button>
  </form>
  <div class="switch-text"><span id="switchText">ليس لديك حساب؟</span> <button onclick="toggleAuthMode()" id="switchBtn">أنشئ حساب</button></div>
</div>

<div id="appScreen">
  <div class="app-header">
    <div class="app-logo">

    <h3>تعديل البروفايل</h3>
    <div class="form-group"><label>الاسم الكامل</label><input type="text" id="editDisplayName" class="input"></div>
    <div class="form-group"><label>البايو</label><input type="text" id="editBio" class="input" placeholder="جملة قصيرة عنك..."></div>
    <div class="modal-btn-row">
      <button class="btn-primary" onclick="saveProfile()">حفظ</button>
      <button class="btn-secondary-modal" onclick="closeEditModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="noteModal">
  <div class="modal-card">
    <h3>📝 نوت المحادثة</h3>
    <p style="color:var(--subtext);font-size:12px;text-align:center;margin-bottom:14px;">شارك ملاحظة تظهر لك وله في هذه المحادثة</p>
    <div class="form-group"><textarea id="noteContent" class="input" style="height:100px" placeholder="اكتب النوت هنا..."></textarea></div>
    <div class="modal-btn-row">
      <button class="btn-primary" onclick="saveNote()">حفظ النوت</button>
      <button class="btn-secondary-modal" onclick="deleteNote()">حذف</button>
    </div>
    <button class="btn-secondary-modal" style="width:100%;margin-top:8px;" onclick="closeNoteModal()">إلغاء</button>
  </div>
</div>

<div class="modal-overlay" id="postModal">
  <div class="modal-card">
    <h3>✍️ تغريدة جديدة</h3>
    <div class="form-group"><textarea id="postContent" class="input" style="height:120px" placeholder="واش راك حاب تقول؟"></textarea></div>
    <div class="form-group"><input type="text" id="postImage" class="input" placeholder="رابط صورة (اختياري)"></div>
    <div class="modal-btn-row">
      <button class="btn-primary" onclick="publishPost()">نشر</button>
      <button class="btn-secondary-modal" onclick="closePostModal()">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let authMode = 'login';
let currentUser = null;
let currentProfile = null;
let currentChatId = null;
let currentChatUser = null;
let msgPolling = null;
let profileData = null;
let currentTab = 'chats';

setTimeout(() => {
  document.getElementById('splash').classList.add('hide');
  const saved = localStorage.getItem('inet_user');
  if (saved) {
    try {
      const u = JSON.parse(saved);
      currentUser = u.user;
      currentProfile = u.profile;
      showApp();
      return;
    } catch(e){}
  }
  document.getElementById('authScreen').classList.add('show');
}, 2200);

function toggleAuthMode() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  const t = document.getElementById('authTitle');
  const s = document.getElementById('authSub');
  const b = document.getElementById('submitBtn');
  const sw = document.getElementById('switchText');
  const sb = document.getElementById('switchBtn');
  const ug = document.getElementById('usernameGroup');
  const dg = document.getElementById('displayNameGroup');
  if (authMode === 'signup') {
    t.innerText = 'إنشاء حساب';
    s.innerText = 'انضم إلينا وابدأ الدردشة.';
    b.innerText = 'إنشاء حساب';
    sw.innerText = 'لديك حساب؟';
    sb.innerText = 'سجّل دخول';
    ug.style.display = 'block';
    dg.style.display = 'block';
  } else {
    t.innerText = 'تسجيل الدخول';
    s.innerText = 'مرحباً بعودتك!';
    b.innerText = 'تسجيل الدخول';
    sw.innerText = 'ليس لديك حساب؟';
    sb.innerText = 'أنشئ حساب';
    ug.style.display = 'none';
    dg.style.display = 'none';
  }
}

async function handleAuth(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const old = btn.innerText;
  btn.innerText = '...';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const endpoint = authMode === 'login' ? '/api/auth/login' : '/api/auth/signup';
  const payload = { email: email, password: password };
  if (authMode === 'signup') {
    payload.username = document.getElementById('username').value.trim();
    payload.display_name = document.getElementById('displayName').value.trim();
  }
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      showToast(data.error || 'حدث خطأ', 'error');
    } else if (authMode === 'signup') {
      showToast('تم الإنشاء! سجل دخولك.', 'success');
      toggleAuthMode();
    } else {
      currentUser = data.user;
      currentProfile = data.profile;
      localStorage.setItem('inet_user', JSON.stringify({user: data.user, profile: data.profile}));
      showToast('مرحباً!', 'success');
      setTimeout(showApp, 500);
    }
  } catch (err) {
    showToast('فشل الاتصال', 'error');
  } finally {
    btn.disabled = false;
    btn.innerText = old;
  }
}

function showApp() {
  document.getElementById('authScreen').classList.remove('show');
  document.getElementById('appScreen').classList.add('show');
  document.getElementById('bottomBar').style.display = 'flex';
  switchMainTab('chats');
}

function logout() {
  localStorage.removeItem('inet_user');
  currentUser = null;
  currentProfile = null;
  if (msgPolling) clearInterval(msgPolling);
  document.getElementById('appScreen').classList.remove('show');
  document.getElementById('chatWindow').classList.remove('show');
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('authScreen').classList.add('show');
  showToast('تم تسجيل الخروج', 'success');
}

function switchMainTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('.nav-btn[data-tab="' + tab + '"]');
  if (btn) btn.classList.add('active');
  const titles = {
    contacts: 'جهات الاتصال',
    chats: 'المحادثات',
    posts: 'تغريدة',
    settings: 'الإعدادات',
    search: 'البحث'
  };
  document.getElementById('pageTitle').innerText = titles[tab] || '';
  document.getElementById('fabCreate').style.display = (tab === 'posts') ? 'flex' : 'none';
  const c = document.getElementById('mainContainer');
  if (tab === 'chats') { loadChats(); }
  else if (tab === 'contacts') { loadContacts(); }
  else if (tab === 'search') { renderSearchPage(); }
  else if (tab === 'posts') { loadPosts(); }
  else if (tab === 'settings') { renderSettings(); }
}

async function loadChats() {
  const c = document.getElementById('mainContainer');
  c.innerHTML = '<div class="section-title">الدردشات الحديثة</div><div class="loader-dots"><span></span><span></span><span></span></div>';
  try {
    const res = await fetch('/api/users?me=' + currentUser.id);
    const data = await res.json();
    const users = (data.users || []).slice(0, 15);
    if (!users.length) {
      c.innerHTML = '<div class="section-title">الدردشات الحديثة</div><div class="empty">مازال ما عندك حتى دردشة.<br>روح لـ جهات الاتصال وابدا محادثة!</div>';
      return;
    }
    let html = '<div class="section-title">ابدا محادثة مع</div>';
    users.forEach(u => {
      const init = (u.display_name || u.username || '?').charAt(0).toUpperCase();
      html += '<div class="card" onclick=\'openChatWith(' + JSON.stringify(u).replace(/'/g, "&#39;") + ')\'>' +
        '<div class="card-avatar">' + init + '</div>' +
        '<div class="card-body"><div class="card-name">' + (u.display_name || u.username) + '</div>' +
        '<div class="card-username">@' + u.username + '</div></div></div>';
    });
    c.innerHTML = html;
  } catch(e) {
    c.innerHTML = '<div class="empty">فشل التحميل</div>';
  }
}

async function loadContacts() {
  const c = document.getElementById('mainContainer');
  c.innerHTML = '<div class="section-title">كل المستخدمين</div><div class="loader-dots"><span></span><span></span><span></span></div>';
  try {
    const res = await fetch('/api/users?me=' + currentUser.id);
    const data = await res.json();
    const users = data.users || [];
    if (!users.length) {
      c.innerHTML = '<div class="section-title">كل المستخدمين</div><div class="empty">ما كاينش مستخدمين آخرين.</div>';
      return;
    }
    let html = '<div class="section-title">كل المستخدمين (' + users.length + ')</div>';
    users.forEach(u => {
      const init = (u.display_name || u.username || '?').charAt(0).toUpperCase();
      html += '<div class="card" onclick=\'openChatWith(' + JSON.stringify(u).replace(/'/g, "&#39;") + ')\'>' +
        '<div class="card-avatar">' + init + '</div>' +
        '<div class="card-body"><div class="card-name">' + (u.display_name || u.username) + '</div>' +
        '<div class="card-username">@' + u.username + '</div></div></div>';
    });
    c.innerHTML = html;
  } catch(e) {
    c.innerHTML = '<div class="empty">فشل التحميل</div>';
  }
}

function renderSearchPage() {
  const c = document.getElementById('mainContainer');
  c.innerHTML = '<div class="search-box">' +
    '<input type="text" id="searchInput" placeholder="ابحث عن مستخدم..." oninput="doSearch()">' +
    '<svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
    '</div><div id="searchResults"><div class="empty">اكتب اسم مستخدم للبحث 🔍</div></div>';
}

let searchTimeout;
function doSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    const q = document.getElementById('searchInput').value.trim();
    const box = document.getElementById('searchResults');
    if (!q) { box.innerHTML = '<div class="empty">اكتب اسم مستخدم للبحث 🔍</div>'; return; }
    box.innerHTML = '<div class="loader-dots"><span></span><span></span><span></span></div>';
    try {
      const res = await fetch('/api/users/search?q=' + encodeURIComponent(q) + '&me=' + currentUser.id);
      const data = await res.json();
      const users = data.users || [];
      if (!users.length) {
        box.innerHTML = '<div class="empty">ما لقيناش نتائج</div>';
        return;
      }
      let html = '<div class="section-title">النتائج (' + users.length + ')</div>';
      users.forEach(u => {
        const init = (u.display_name || u.username || '?').charAt(0).toUpperCase();
        html += '<div class="card" onclick=\'openChatWith(' + JSON.stringify(u).replace(/'/g, "&#39;") + ')\'>' +
          '<div class="card-avatar">' + init + '</div>' +
          '<div class="card-body"><div class="card-name">' + (u.display_name || u.username) + '</div>' +
          '<div class="card-username">@' + u.username + '</div></div></div>';
      });
      box.innerHTML = html;
    } catch(e) { box.innerHTML = '<div class="empty">فشل البحث</div>'; }
  }, 350);
}

async function openChatWith(otherUser) {
  currentChatUser = otherUser;
  document.getElementById('chatUserName').innerText = otherUser.display_name || otherUser.username;
  try {
    const res = await fetch('/api/chats/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user1: currentUser.id, user2: otherUser.id})
    });
    const data = await res.json();
    if (data.chat_id) {
      currentChatId = data.chat_id;
      document.getElementById('chatWindow').classList.add('show');
      document.getElementById('chatMessages').innerHTML = '';
      loadNote();
      loadMessages();
      if (msgPolling) clearInterval(msgPolling);
      msgPolling = setInterval(loadMessages, 2500);
    } else {
      showToast(data.error || 'فشل فتح الدردشة', 'error');
    }
  } catch(e) { showToast('فشل الاتصال', 'error'); }
}

function closeChat() {
  document.getElementById('chatWindow').classList.remove('show');
  if (msgPolling) { clearInterval(msgPolling); msgPolling = null; }
  currentChatId = null;
  currentChatUser = null;
  loadChats();
}

let lastMsgCount = 0;
async function loadMessages() {
  if (!currentChatId) return;
  try {
    const res = await fetch('/api/messages/' + currentChatId);
    const data = await res.json();
    const msgs = data.messages || [];
    if (msgs.length === lastMsgCount) return;
    lastMsgCount = msgs.length;
    const box = document.getElementById('chatMessages');
    box.innerHTML = '';
    if (!msgs.length) {
      box.innerHTML = '<div class="empty">ابدا المحادثة بإرسال رسالة 👋</div>';
      return;
    }
    msgs.forEach(m => {
      const mine = m.sender_id === currentUser.id;
      const time = m.created_at ? new Date(m.created_at).toLocaleTimeString('ar-DZ', {hour:'2-digit', minute:'2-digit'}) : '';
      const div = document.createElement('div');
      div.className = 'msg ' + (mine ? 'me' : 'other');
      div.innerHTML = m.content + '<span class="msg-time">' + time + '</span>';
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch(e){}
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  input.value = '';
  try {
    await fetch('/api/messages/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: currentChatId, sender_id: currentUser.id, content: text})
    });
    lastMsgCount = 0;
    loadMessages();
  } catch(e) { showToast('فشل الإرسال', 'error'); }
}

async function loadNote() {
  if (!currentChatId) return;
  try {
    const res = await fetch('/api/chat/' + currentChatId + '/note');
    const data = await res.json();
    const banner = document.getElementById('chatNoteBanner');
    if (data.note) {
      banner.innerHTML = '<div class="chat-note-banner" onclick="openNoteModal()">' +
        '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
        '<div class="chat-note-text">' + data.note.content + '</div></div>';
    } else {
      banner.innerHTML = '<div class="chat-note-banner" onclick="openNoteModal()" style="opacity:0.6;">' +
        '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        '<div class="chat-note-text">أضف نوت للمحادثة</div></div>';
    }
  } catch(e){}
}

function openNoteModal() {
  document.getElementById('noteContent').value = '';
  fetch('/api/chat/' + currentChatId + '/note')
    .then(r => r.json())
    .then(d => { if (d.note) document.getElementById('noteContent').value = d.note.content; })
    .catch(() => {});
  document.getElementById('noteModal').classList.add('show');
}

function closeNoteModal() {
  document.getElementById('noteModal').classList.remove('show');
}

async function saveNote() {
  const content = document.getElementById('noteContent').value.trim();
  if (!content) { showToast('اكتب النوت', 'error'); return; }
  try {
    await fetch('/api/chat/' + currentChatId + '/note', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: currentUser.id, content: content})
    });
    closeNoteModal();
    loadNote();
    showToast('تم حفظ النوت', 'success');
  } catch(e) { showToast('فشل الحفظ', 'error'); }
}

async function deleteNote() {
  if (!confirm('حذف النوت؟')) return;
  try {
    await fetch('/api/chat/' + currentChatId + '/note', {method: 'DELETE'});
    closeNoteModal();
    loadNote();
    showToast('تم الحذف', 'success');
  } catch(e) {}
}

async function loadPosts() {
  const c = document.getElementById('mainContainer');
  c.innerHTML = '<div class="section-title">آخر التغريدات</div><div class="loader-dots"><span></span><span></span><span></span></div>';
  try {
    const res = await fetch('/api/posts');
    const data = await res.json();
    const posts = data.posts || [];
    if (!posts.length) {
      c.innerHTML = '<div class="section-title">آخر التغريدات</div><div class="empty">مازال ما كاين حتى تغريدة.<br>اضغط على + لكتابة أول تغريدة!</div>';
      return;
    }
    let html = '<div class="section-title">آخر التغريدات (' + posts.length + ')</div>';
    posts.forEach(p => {
      const init = (p.display_name || p.username || '?').charAt(0).toUpperCase();
      const name = p.display_name || p.username || 'مستخدم';
      const time = p.created_at ? new Date(p.created_at).toLocaleString('ar-DZ') : '';
      const mine = p.user_id === currentUser.id;
      html += '<div class="post-card">' +
        '<div class="post-head">' +
        '<div class="post-avatar">' + init + '</div>' +
        '<div class="post-info"><div class="post-name">' + name + '</div>' +
        '<div class="post-time">' + time + '</div></div></div>' +
        '<div class="post-text">' + p.content + '</div>' +
        (p.image_url ? '<img src="' + p.image_url + '" class="post-image" onerror="this.style.display=\'none\'">' : '') +
        (mine ? '<div class="post-actions"><button class="post-del" onclick="deletePost(\'' + p.id + '\')">حذف</button></div>' : '') +
        '</div>';
    });
    c.innerHTML = html;
  } catch(e) {
    c.innerHTML = '<div class="empty">فشل التحميل</div>';
  }
}

function openCreatePost() {
  document.getElementById('postContent').value = '';
  document.getElementById('postImage').value = '';
  document.getElementById('postModal').classList.add('show');
}

function closePostModal() {
  document.getElementById('postModal').classList.remove('show');
}

async function publishPost() {
  const content = document.getElementById('postContent').value.trim();
  const image = document.getElementById('postImage').value.trim();
  if (!content) { showToast('اكتب محتوى التغريدة', 'error'); return; }
  try {
    const res = await fetch('/api/posts/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: currentUser.id, content: content, image_url: image || null})
    });
    const data = await res.json();
    if (res.ok) {
      closePostModal();
      loadPosts();
      showToast('تم النشر!', 'success');
    } else {
      showToast(data.error || 'فشل النشر', 'error');
    }
  } catch(e) { showToast('فشل الاتصال', 'error'); }
}

async function deletePost(id) {
  if (!confirm('حذف التغريدة؟')) return;
  try {
    await fetch('/api/posts/' + id, {method: 'DELETE'});
    loadPosts();
    showToast('تم الحذف', 'success');
  } catch(e) {}
}

async function renderSettings() {
  const c = document.getElementById('mainContainer');
  try {
    const res = await fetch('/api/profile/' + currentUser.id);
    const data = await res.json();
    if (data.profile) profileData = data.profile;
  } catch(e) {}
  const p = profileData || currentProfile || {};
  const init = (p.display_name || p.username || '?').charAt(0).toUpperCase();
  c.innerHTML = '<div class="profile-content">' +
    '<div class="profile-big-avatar">' + init + '</div>' +
    '<div class="profile-display-name">' + (p.display_name || p.username || 'مستخدم') + '</div>' +
    '<div class="profile-username">@' + (p.username || 'user') + '</div>' +
    '<div class="profile-bio">' + (p.bio || 'لا يوجد بايو') + '</div>' +
    '<button class="profile-edit-btn" onclick="openEditProfile()">✏️ تعديل البروفايل</button>' +

    '<div class="settings-group"><div class="settings-group-title">الحساب</div>' +
    '<div class="setting-row" onclick="openEditProfile()">' +
    '<div class="setting-row-left"><div class="setting-row-icon"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>' +
    '<div class="setting-row-label">تعديل الاسم والبائو</div></div>' +
    '<div class="setting-row-value">›</div></div>' +
    '<div class="setting-row"><div class="setting-row-left">' +
    '<div class="setting-row-icon"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>' +
    '<div class="setting-row-label">حساب خاص</div></div>' +
    '<div class="setting-toggle ' + (p.is_private ? 'on' : '') + '" id="privToggle" onclick="togglePrivacy()"></div></div>' +
    '</div>' +

    '<div class="settings-group"><div class="settings-group-title">التطبيق</div>' +
    '<div class="setting-row" onclick="toggleDarkMode()">' +
    '<div class="setting-row-left"><div class="setting-row-icon"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>' +
    '<div class="setting-row-label">الوضع الليلي</div></div>' +
    '<div class="setting-toggle ' + (document.body.classList.contains('light-mode') ? '' : 'on') + '" id="darkToggle"></div></div>' +
    '<div class="setting-row" onclick="toggleNotifications()">' +
    '<div class="setting-row-left"><div class="setting-row-icon"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>' +
    '<div class="setting-row-label">الإشعارات</div></div>' +
    '<div class="setting-toggle on" id="notifToggle"></div></div>' +
    '</div>' +

    '<div class="settings-group"><div class="settings-group-title">الأمان</div>' +
    '<div class="setting-row danger" onclick="showToast(\'قريباً!\',\'success\')">' +
    '<div class="setting-row-left"><div class="setting-row-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>' +
    '<div class="setting-row-label">الحسابات المحظورة</div></div>' +
    '<div class="setting-row-value">›</div></div>' +
    '<div class="setting-row danger" onclick="showToast(\'قريباً!\',\'success\')">' +
    '<div class="setting-row-left"><div class="setting-row-icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></div>' +
    '<div class="setting-row-label">حذف الحساب</div></div>' +
    '<div class="setting-row-value">›</div></div>' +
    '<div class="setting-row danger" onclick="logout()">' +
    '<div class="setting-row-left"><div class="setting-row-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>' +
    '<div class="setting-row-label">تسجيل الخروج</div></div>' +
    '<div class="setting-row-value">›</div></div>' +
    '</div></div>';
}

function openEditProfile() {
  if (!profileData) profileData = currentProfile || {};
  document.getElementById('editDisplayName').value = profileData.display_name || '';
  document.getElementById('editBio').value = profileData.bio || '';
  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
}

async function saveProfile() {
  const display_name = document.getElementById('editDisplayName').value.trim();
  const bio = document.getElementById('editBio').value.trim();
  if (!display_name) { showToast('الاسم مطلوب', 'error'); return; }
  try {
    const res = await fetch('/api/profile/update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: currentUser.id, display_name: display_name,
        bio: bio, is_private: profileData.is_private || false
      })
    });
    const data = await res.json();
    if (res.ok) {
      profileData = data.profile;
      currentProfile = data.profile;
      localStorage.setItem('inet_user', JSON.stringify({user: currentUser, profile: currentProfile}));
      closeEditModal();
      renderSettings();
      showToast('تم التحديث!', 'success');
    } else {
      showToast(data.error || 'فشل', 'error');
    }
  } catch(e) { showToast('فشل الاتصال', 'error'); }
}

async function togglePrivacy() {
  if (!profileData) return;
  profileData.is_private = !profileData.is_private;
  const el = document.getElementById('privToggle');
  if (el) el.classList.toggle('on', profileData.is_private);
  try {
    await fetch('/api/profile/update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: currentUser.id, display_name: profileData.display_name,
        bio: profileData.bio, is_private: profileData.is_private
      })
    });
    showToast(profileData.is_private ? 'حسابك خاص' : 'حسابك عام', 'success');
  } catch(e) {}
}

function toggleDarkMode() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('inet_dark', isLight ? 'off' : 'on');
  const t = document.getElementById('darkToggle');
  if (t) t.classList.toggle('on', !isLight);
  showToast(!isLight ? 'الوضع الليلي' : 'الوضع النهاري', 'success');
}

function toggleNotifications() {
  const t = document.getElementById('notifToggle');
  if (!t) return;
  const isOn = t.classList.toggle('on');
  localStorage.setItem('inet_notif', isOn ? 'on' : 'off');
  showToast(isOn ? 'الإشعارات مفعّلة' : 'الإشعارات مطفيّة', 'success');
}

window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('inet_dark') === 'off') {
    document.body.classList.add('light-mode');
  }
});

function showToast(msg, type) {
  type = type || 'success';
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
