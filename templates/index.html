<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNetchat — دردشة خاصة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
            background: #0b0b0f;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            direction: rtl;
        }
        
        .container { max-width: 420px; }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: linear-gradient(135deg, #0a84ff, #0062d2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 15px 40px rgba(10, 132, 255, 0.4);
        }
        
        .logo svg {
            width: 55px;
            height: 55px;
            fill: #fff;
        }
        
        h1 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #0a84ff, #5ac8fa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        
        .tagline {
            color: #8e8e93;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        
        .badge {
            display: inline-block;
            background: rgba(50, 215, 75, 0.12);
            color: #32d74b;
            padding: 10px 20px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(50, 215, 75, 0.3);
        }
        
        .loader {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 28px;
        }
        
        .loader span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0a84ff;
            animation: pulse 1.4s ease-in-out infinite;
        }
        
        .loader span:nth-child(2) { animation-delay: 0.2s; background: #ff453a; }
        .loader span:nth-child(3) { animation-delay: 0.4s; background: #ff9f0a; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
            </svg>
        </div>
        <h1>iNetchat</h1>
        <p class="tagline">تطبيق الدردشة الخاص بك، مع التركيز على الخصوصية والبساطة.</p>
        <div class="badge">✓ قيد التطوير</div>
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</body>
</html>
